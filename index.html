<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Lian</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden; display: grid; place-items: center;
      background: radial-gradient(circle at bottom, #37204d 0%, #171025 45%, #080712 100%);
      color: #fff5fa; font-family: Georgia, "Times New Roman", serif;
    }
    /* CSS rockets: styled after the colorful rising-and-bursting TikTok reference. */
    #fireworks { position: fixed; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; }
    .loop-firework { display: none; }
    .loop-firework::before { content: ''; position: absolute; left: 1px; bottom: 0; width: 3px; height: 115vh; background: linear-gradient(transparent 0%, transparent 78%, #fff 97%); filter: drop-shadow(0 0 6px #fff); animation: rocket 4s linear infinite; }
    .spark { position: absolute; left: 1px; top: 1px; width: 4px; height: 20px; border-radius: 999px; background: hsl(var(--h) 100% 70%); box-shadow: 0 0 8px hsl(var(--h) 100% 70%); transform-origin: 50% 0; animation: spark 4s ease-out infinite; animation-delay: var(--delay); }
    .f1 { left: 18%; top: 27%; --delay: 0s; } .f2 { left: 78%; top: 25%; --delay: -1.3s; } .f3 { left: 52%; top: 17%; --delay: -2.6s; } .f4 { left: 68%; top: 62%; --delay: -3.4s; }
    .f1::before { animation-delay: 0s; } .f2::before { animation-delay: -1.3s; } .f3::before { animation-delay: -2.6s; } .f4::before { animation-delay: -3.4s; }
    @keyframes rocket { 0% { opacity: 0; transform: translateY(72vh) scaleY(.2); } 8% { opacity: 1; } 30% { opacity: 1; transform: translateY(0) scaleY(1); } 32%, 100% { opacity: 0; transform: translateY(0) scaleY(1); } }
    @keyframes spark { 0%, 30% { opacity: 0; transform: rotate(var(--angle)) translateY(0) scaleY(.2); } 36% { opacity: 1; } 70% { opacity: .72; transform: rotate(var(--angle)) translateY(calc(-1 * var(--length))) scaleY(1); } 100% { opacity: 0; transform: rotate(var(--angle)) translateY(calc(-1 * var(--length))) scaleY(.35); } }
    .card {
      position: relative; z-index: 2; width: min(88vw, 520px); padding: 48px 28px 28px;
      text-align: center; border: 1px solid rgba(255,255,255,.2); border-radius: 28px;
      background: rgba(18, 10, 31, .76);
      box-shadow: 0 24px 80px rgba(0,0,0,.4); animation: float 5s ease-in-out infinite;
    }
    .message { font-size: clamp(2.5rem, 11vw, 4.7rem); line-height: .95; margin: 0; letter-spacing: -.06em; }
    .message span { display: inline-block; opacity: 0; transform: translateY(20px); animation: appear .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .message span:nth-child(1) { animation-delay: .5s; }
    .message span:nth-child(2) { animation-delay: 1.15s; }
    .sign { margin: 22px 6px 30px; font-size: clamp(1.2rem, 5vw, 1.65rem); opacity: 0; animation: appear .8s 1.9s forwards; }
    .spotify { opacity: 0; animation: appear .8s 2.45s forwards; }
    .play-button { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #ff709c, #ba75ff); color: #fff; font: 700 16px system-ui, sans-serif; cursor: pointer; box-shadow: 0 8px 25px rgba(224,94,189,.35); transition: transform .2s, box-shadow .2s; }
    .play-button:hover { transform: scale(1.04); box-shadow: 0 12px 32px rgba(224,94,189,.56); }
    .hint { font: 12px/1.45 system-ui, sans-serif; opacity: .58; margin: 12px 0 0; }
    @keyframes appear { to { opacity: 1; transform: translateY(0); } }
    @keyframes float { 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>
  <i class="loop-firework f1"></i><i class="loop-firework f2"></i><i class="loop-firework f3"></i><i class="loop-firework f4"></i>
  <main class="card">
    <h1 class="message"><span>i miss</span><br><span>you</span></h1>
    <p class="sign">– Lian</p>
    <div class="spotify">
      <button class="play-button" id="launchFireworks" type="button">✦ Launch fireworks</button>
      <p class="hint" id="musicHint">A little surprise for you</p>
    </div>
  </main>
  <audio id="song" preload="auto" autoplay>
    <source src="about-you.mp3" type="audio/mpeg" />
  </audio>
  <script>
    const canvas = document.querySelector('#fireworks');
    const ctx = canvas.getContext('2d');
    let particles = [], rockets = [];
    const MAX_PARTICLES = 450;
    function resize() {
      const scale = Math.min(devicePixelRatio, 1.25);
      canvas.width = Math.round(innerWidth * scale); canvas.height = Math.round(innerHeight * scale);
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
    }
    // Layered translucent circles give a soft glow without a blur pass per spark.
    function glow(x, y, radius, hue, alpha) {
      ctx.fillStyle = `hsla(${hue},100%,65%,${alpha * .07})`;
      ctx.beginPath(); ctx.arc(x,y,radius*3.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsla(${hue},100%,75%,${alpha * .22})`;
      ctx.beginPath(); ctx.arc(x,y,radius*1.8,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = `hsla(${hue},100%,85%,${alpha})`;
      ctx.beginPath(); ctx.arc(x,y,radius,0,Math.PI*2); ctx.fill();
    }
    addEventListener('resize', resize); resize();
    function burst(x, y) {
      const hues = [330, 15, 45, 190, 280]; const hue = hues[Math.floor(Math.random() * hues.length)];
      const count = 32 + Math.floor(Math.random() * 20);
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2, s = 1.2 + Math.random() * 4.1;
        particles.push({x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, h: hue + Math.random()*22, l: 60 + Math.random()*20, life: 1, decay: .009 + Math.random()*.012, size: 1.3 + Math.random()*2.5});
      }
      // Keep memory and frame rate stable forever instead of accumulating particles.
      if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);
    }
    function launch() {
      rockets.push({ x: innerWidth * (.1 + Math.random()*.8), y: innerHeight + 12, targetY: 70 + Math.random()*innerHeight*.45, speed: 7 + Math.random()*3, hue: Math.random()*360, trail: [] });
    }
    let previousFrame = -Infinity;
    function draw(time) {
      // Limit high-refresh displays to 60 updates per second.
      if (time - previousFrame < 16) { requestAnimationFrame(draw); return; }
      previousFrame = time;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(8,7,18,.13)'; ctx.fillRect(0, 0, innerWidth, innerHeight);
      ctx.globalCompositeOperation = 'lighter';
      rockets = rockets.filter(r => {
        r.trail.push({x:r.x, y:r.y}); if (r.trail.length > 12) r.trail.shift();
        r.y -= r.speed;
        r.trail.forEach((t, i) => { ctx.beginPath(); ctx.arc(t.x, t.y, 1 + i/9, 0, Math.PI*2); ctx.fillStyle = `hsla(${r.hue},100%,78%,${i/r.trail.length})`; ctx.fill(); });
        glow(r.x, r.y, 2.5, r.hue, 1);
        if (r.y <= r.targetY) { burst(r.x, r.y); return false; } return true;
      });
      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.life -= p.decay;
        // An expired spark must never reach arc(): a negative radius throws
        // and prevents the next animation frame from being scheduled.
        if (p.life <= 0) continue;
        p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy += .038;
        glow(p.x, p.y, p.size*p.life, p.h, p.life);
      }
      ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
      requestAnimationFrame(draw);
    }
    // These launches never stop while the page remains open.
    let fireworksTimer = null;
    function beginFireworks() {
      if (fireworksTimer) return;
      launch(); setTimeout(launch, 180); setTimeout(launch, 360);
      // Regular launches, capped so the animation stays smooth instead of eventually freezing.
      fireworksTimer = setInterval(() => { if (rockets.length < 7) launch(); }, 520);
    }
    requestAnimationFrame(draw);
    // Build colorful trails for the CSS fireworks. Their animation is handled by CSS,
    // so the bursts keep cycling independently of the canvas loop.
    document.querySelectorAll('.loop-firework').forEach((firework, group) => {
      for (let i = 0; i < 24; i++) {
        const spark = document.createElement('b');
        spark.className = 'spark';
        spark.style.setProperty('--angle', `${i * 15 + (group % 2 ? 7 : 0)}deg`);
        spark.style.setProperty('--length', `${86 + (i % 6) * 17}px`);
        spark.style.setProperty('--h', `${(i * 31 + group * 83) % 360}`);
        spark.style.setProperty('--delay', firework.style.getPropertyValue('--delay') || getComputedStyle(firework).getPropertyValue('--delay'));
        firework.appendChild(spark);
      }
    });
    const song = document.querySelector('#song');
    // Attempt audio immediately. Browsers may require a user interaction before allowing sound.
    song.play().catch(() => {
      document.querySelector('#musicHint').textContent = 'Tap anywhere for music ✦';
    });
    function unlockAudio() {
      if (song.paused) song.play().then(() => {
        document.querySelector('#musicHint').textContent = 'A little surprise for you ✦';
      }).catch(() => {});
    }
    addEventListener('pointerdown', unlockAudio);
    addEventListener('keydown', unlockAudio);
    document.querySelector('#launchFireworks').addEventListener('click', (event) => {
      beginFireworks();
      event.currentTarget.textContent = '✦ Fireworks launched';
      document.querySelector('#musicHint').textContent = 'Look up ✦';
    });
  </script>
</body>
</html>
